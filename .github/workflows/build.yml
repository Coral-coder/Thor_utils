name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core-tests:
    name: Core logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs without the Android SDK on purpose: this job proves the ROM
      # identification, sorting and battery logic stand on their own.
      - name: Run core tests
        run: ./gradlew :core:test -PthorCoreOnly --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Name the artifacts
        id: rename
        run: |
          mkdir -p dist
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          short_sha="$(git rev-parse --short HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ThorUtils-${version}-${short_sha}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/ThorUtils-${version}-${short_sha}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: thor-utils-apks
          path: dist/*.apk
          if-no-files-found: error

      # Every push to the default branch refreshes a single rolling release, so
      # there is always one obvious "latest build" link to install from.
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build from `${{ github.sha }}`.

            Install `ThorUtils-*.apk` (the release build) on the AYN Thor.
            The `-debug` APK is side-by-side installable for testing.
          files: dist/*.apk
          prerelease: true
          make_latest: false

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
